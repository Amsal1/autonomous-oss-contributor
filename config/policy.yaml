# Gatekeeper policy (DESIGN §12.6). Loaded only via the config snapshot (§7.9): edits take
# effect after /reload (Telegram) or `ossctl config reload` plus a human confirm.
# Unknown keys are rejected. Effective forbidden paths/logins/confidentiality = config ∪ floor.
version: 1
dry_run_default: true
lifecycle:                         # CR-001 graceful down/up (ossctl down|up, scripts\down.ps1 -Timeout overrides)
  drain_timeout_s: 120             # running work gets this long, then it is marked interrupted
  up_health_timeout_s: 180         # ossctl up waits this long for the units to be healthy
sandbox:
  coder_mode: split                # split only in v1 (single is phase 2)
  kiro_trust_mode: ids             # ids = --trust-tools=<exact ids>; all = --trust-all-tools (needs probes under 'all')
limits:
  prs_per_24h: 2
  open_prs_per_repo: 1
  comments_per_24h: 10
  issue_claims_per_24h: 2
  max_concurrent_pipelines: 2
  max_awaiting_approval: 5
  approval_ttl_hours: 72
  confirm_ttl_seconds: 300
  contribution_expiry_days: 7
  watch_rounds_max: 3
  repo_cooldown_days_after_close: 30
  repo_cooldown_days_after_user_reject: 7
  rediscover_cooldown_days: 7        # M6: per issue, after FAILED/ABANDONED/EXPIRED/other SKIPPED
  max_implement_attempts: 2          # extra implement attempts after a validation failure (§9.1)
  max_review_rounds: 2
  max_change_rounds: 5
diff:                              # hard safety ceiling (CR-004 Amendment B): runaway-agent guard, config file only
  max_files: 80                    # every changed path counts, excluded globs included
  max_changed_lines: 3000          # non-test lines (size.exclude_globs excluded)
  max_test_lines: 3000             # test lines (size.test_globs), counted separately
  forbidden_paths: [".github/workflows/**", ".github/actions/**", "**/CODEOWNERS", "LICENSE*", "COPYING*", "**/*.pem", "**/*.key", "**/.env*", ".kiro/**", ".git*/hooks/**"]
  forbid_binary: true
  forbid_submodule_changes: true
  forbid_symlinks: true
  forbid_file_modes: ["120000", "160000"]
text:
  title_max: 256
  body_max: 60000          # GitHub hard limit is 65536
  comment_max: 20000
  commit_message_max: 10000
  commit_subject_max: 100
  confidentiality_denylist: []   # generic extras; personal strings go in profile.yaml confidentiality_floor
  require_disclosure: true
secrets:
  gitleaks: true
  extra_patterns: ["ksk_[A-Za-z0-9_\\-]{16,}", "gh[pousr]_[A-Za-z0-9]{36,}", "github_pat_[A-Za-z0-9_]{60,}", "\\d{6,12}:[A-Za-z0-9_-]{30,}"]
  kiro_key_hash_check: true
anomaly:                           # not enforced yet; the per-job egress limits are egress.yaml `anomaly`
  max_consecutive_stage_failures: 5
  max_proxy_denies_per_task: 50
  max_kiro_invocations_per_hour: 120
validation:
  stack:
    enabled: false                 # phase 2 (§10.7)
size:                              # §9.14: soft preference for what the bot picks on its own, never a rule against you
  autonomous_max_class: s          # xs…xl (xxl never selectable); autonomous discovery only; must fit the ceiling
  preferred_classes: [xs, s]       # ranking preference
  overrun_tolerance: 0.5           # flag on the preview card when code lines exceed the estimate by > 50 %
  on_overrun: flag                 # flag (default) | reapprove (back to gate 1 when the class grows)
  exclude_globs: ["**/*.lock", "**/package-lock.json", "**/go.sum", "**/__snapshots__/**", "**/vendor/**", "**/*.min.js", "**/*_generated.*", "**/*.pb.go"]
  test_globs: ["**/test/**", "**/tests/**", "**/*_test.*", "**/test_*.py", "**/*.test.*", "**/*.spec.*", "**/__tests__/**"]
discovery_filters:                 # autonomous discovery only; /filters and per-repo overrides
  allowed_kinds: [bug, docs, tests, small-feature, ci-fix, refactor-small]
  excluded_kinds: [breaking-change, new-dependency, api-redesign, security-sensitive-crypto]
  require_labels_any: []           # e.g. good first issue, help wanted, bug; per target too
  max_issue_age_days: 180
  min_maintainer_activity_days: 60
  languages: []
  validation_tier_max: T1          # T0 | T1 | T2
proposal:                          # gate 1 (§9.5b)
  ttl_hours: 72
  max_per_day: 5
  claim_comment: off               # off | on (claim comment only after gate 1)
  max_concurrent_scouts: 2
discovery:
  proactive: false
  interval_hours: 6
  top_n: 5
  proposals_per_cycle: 3           # proposal cards per discovery cycle
  ci_on_pr_weight: 6.0             # 0..30: ranking boost for repos whose CI runs tests/lint on PRs; never a filter
  ci_facts_ttl_hours: 168          # 1..720: how long a repo's CI-on-PR facts are reused
  max_default_branch_age_days: 180 # 30..3650: skip a repo (seed or discovered) whose default branch's last commit is older
  open:                            # post-v1 open discovery: repos found by topic search, not only targets.yaml
    enabled: true                  # /filters page "Open" can toggle it (a preference, audited, 60 s undo)
    topics: [devops, platform-engineering, kubernetes, terraform, infrastructure-as-code, gitops, observability, sre, cloudformation, aws, ci-cd, helm, monitoring, opentelemetry, llm-observability]  # 1..30 GitHub topics; /filters edits them
    min_stars: 1000                # 100..1000000: repos below are never recorded (config-only)
    pushed_within_days: 60         # 7..365: last push at most this old (config-only)
    languages_preferred: [Java, JavaScript, TypeScript, Python, Rust, Go, HCL, CloudFormation]  # ranking preference, not a filter; /filters edits it
    language_weight: 6.0           # 0..30: ranking boost for a preferred language (config-only)
    new_repos_per_cycle: 5         # 1..20: open repos whose issues are scanned per cycle (config-only)
    topics_per_cycle: 3            # 1..15: topic searches per cycle, round-robin over topics (config-only)
    reserved_slots: 1              # 0..3 (<= proposals_per_cycle): cards kept for open candidates behind the seed targets
    repo_cooldown_days: 14         # 1..365: a scanned or skipped repo isn't searched again before this (config-only)
    search_budget: 10              # 3..25 (>= topics_per_cycle + reserved_slots + 2): GitHub searches per cycle (config-only)
    issue_labels: ["good first issue", "help wanted", bug, documentation, docs]  # 1..10: issue search labels (OR; config-only)
vet:
  ai_policy:                       # §9.5: skip only on an explicit ban; banned is fixed
    unstated: allow                # allow | skip: no AI wording in any repo doc
    unclear: allow                 # allow | skip: AI mentioned, neither banned nor allowed
    banned: skip                   # always skip (any other value is rejected)
telegram:
  mode: single
hermes:                            # §15.5; switch with ossctl hermes tier <tier> (TTY confirm) or /hermes tier
  capability_tier_default: self_improve   # locked | research | self_improve; unparseable flag = locked
  context_length: 200000             # Hermes model.context_length (8192..2000000): the chat model's window
chat:                               # §15.6: files the owner sends the assistant
  attachments:
    max_mb: 20                      # Bot API getFile limit; bigger files are refused with a reply
    strip_metadata: true            # EXIF/XMP/text chunks removed without decoding pixels (no Pillow)
    allowed: [image, pdf, text, audio]   # audio: answered "Voice isn't supported yet" until Kiro takes audio
    pdf_text_max_bytes: 2097152     # text extracted in a --network none sandbox job (pdftotext)
    retention_hours: 24             # attachment files are deleted after this
backup:
  include_secrets: false
  keep: 8
retention:                         # §18.10: time-based only, no size caps; journal retention is the journald drop-in
  contributions_days: 30           # terminal contributions' mirrors, derived, imports, work bundles, artifacts; unused cache repos
  telegram_rows_days: 90           # closed tg_outbox, tg_views and ui_tokens rows
  run_logs_days: 30                # /srv/ossbot/logs/runs/*.log
  proxy_logs_days: 30              # rotated squid access.log.* (>= 30: per-job egress evidence)
  hermes_sessions_days: 90         # /home/hermes/.hermes/sessions/* files idle this long
  tmp_days: 7                      # /tmp top-level leftovers
  docker_build_cache_hours: 168    # Docker build cache unused this long
  disk_warn_gib: 40                # doctor WARNs when / uses more than this

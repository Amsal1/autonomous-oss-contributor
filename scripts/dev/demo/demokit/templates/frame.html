<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
<title>ossbot demo</title>
<style>
$css
</style>
</head>
<body class="$theme $layout">
<main class="stage">
<div class="phone" role="img" aria-label="$aria">
<div class="statusbar" data-chrome="status"><span>9:41</span><span class="bars"></span></div>
<div class="header" data-chrome="header"><span class="back"></span><span class="avatar">ob</span><span class="who"><span class="name">ossbot</span><span class="topic">$topic</span></span></div>
$pinned
<div class="chat">
$messages
</div>
<div class="inputbar" data-chrome="input"><span class="field">Message</span></div>
</div>
$caption
</main>
</body>
</html>

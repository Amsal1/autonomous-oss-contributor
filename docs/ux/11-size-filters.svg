<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="900" viewBox="0 0 1680 900" role="img" aria-labelledby="title desc">
  <title id="title">ossbot mockup: /size and /filters pickers, and user-directed work from a pasted GitHub link</title>
  <desc id="desc">Left phone: the /size message shows the autonomous size preference, preferred classes, that user requests ignore it, per-repo overrides, the read-only hard ceiling, the overrun mode and recent merge rates, with class buttons xs to xl, Preferred and Per repo buttons, and the Undo row after a change. Middle phone: /filters page 1 of 3 with ten kind toggles in five rows and a pager row with More, Undo and Labels, plus a preview of page 2 with label toggles and the validation tier. Right phone: a pasted GitHub issue link answered by a link card with Work on this and Dismiss, the card after Work on this showing that scouting started and that the item is requested by you, and a refusal card for a repository that bans AI-assisted contributions.</desc>

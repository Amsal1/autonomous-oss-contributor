  <!-- ============ NOTES ============ -->
  <text class="note nh" x="1280" y="58">/size · /filters · /work (CR-004 Amendment B)</text>
  <text class="note b" x="1280" y="86">What they change</text>
  <text class="note" x="1280" y="104">• Autonomous discovery only: what the bot</text>
  <text class="note" x="1280" y="120">  proposes on its own. 👤 work skips them.</text>
  <text class="note" x="1280" y="138">• Class tap / toggle: immediate (class "tune"),</text>
  <text class="note" x="1280" y="154">  audited, silent FYI, Undo for 60 s.</text>
  <text class="note" x="1280" y="172">• Never touches an approved proposal, a 👤 item,</text>
  <text class="note" x="1280" y="188">  either gate, or the ceiling (U13).</text>
  <text class="note" x="1280" y="206">• Ceiling (policy.diff 80 / 3,000 / 3,000): shown</text>
  <text class="note" x="1280" y="222">  read-only; config file + /reload only.</text>
  <text class="note b" x="1280" y="252">Telegram constraints</text>
  <text class="note" x="1280" y="270">• /size: 4 rows; 3 per row only when every label</text>
  <text class="note" x="1280" y="286">  is ≤ 12 chars ("✅ m ≤250" = 8).</text>
  <text class="note" x="1280" y="304">• /filters: ≤ 5 toggle rows + 1 pager row per</text>
  <text class="note" x="1280" y="320">  page; 2 per row (labels > 12); longest label</text>
  <text class="note" x="1280" y="336">  "⬜ Breaking change" = 17 ≤ 24.</text>
  <text class="note" x="1280" y="354">• Single-button rows ≤ 64 ("⬜ Any label (no</text>
  <text class="note" x="1280" y="370">  label required)" = 32).</text>
  <text class="note" x="1280" y="388">• Every button is a 24-byte token; kind and label</text>
  <text class="note" x="1280" y="404">  names are fixed constants, never repo text.</text>
  <text class="note" x="1280" y="422">• Text ≤ 600 chars; toast ≤ 180 chars.</text>
  <text class="note b" x="1280" y="452">Storage</text>
  <text class="note" x="1280" y="470">• DiscoveryPrefs → discovery_prefs (scope '*' or</text>
  <text class="note" x="1280" y="486">  'owner/repo'); effective = repo ?? global ??</text>
  <text class="note" x="1280" y="502">  policy.yaml. ossctl size/filters use it too.</text>
  <text class="note b" x="1280" y="532">/work and link cards</text>
  <text class="note" x="1280" y="550">• Accepts github.com repo, /issues/N, /pull/N</text>
  <text class="note" x="1280" y="566">  (query and fragment stripped); notes ≤ 1,000.</text>
  <text class="note" x="1280" y="584">• ≤ 3 link cards per message; built only from the</text>
  <text class="note" x="1280" y="600">  parsed URL + GitHub read facts, never your text.</text>
  <text class="note" x="1280" y="618">• Class "request": queues a scout only; nothing</text>
  <text class="note" x="1280" y="634">  runs or publishes before gate 1 and gate 2.</text>
  <text class="note" x="1280" y="652">• 👤 proposals sort in class 1 and arrive loud.</text>
  <text class="note b" x="1280" y="682">Digest (§7.4)</text>
  <text class="note" x="1280" y="700">• Weekly: merge rate by class (xs, s, m, l+ while</text>
  <text class="note" x="1280" y="716">  &lt; 3 PRs each) + a "👤 yours" row; rate only from</text>
  <text class="note" x="1280" y="732">  ≥ 3 PRs; the /size line shows the 90-day numbers.</text>
</svg>

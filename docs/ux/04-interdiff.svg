  <rect x="30" y="800" width="370" height="70" fill="#ffffff"/>
  <rect x="42" y="814" width="70" height="30" rx="15" fill="#2f7fe0"/>
  <text class="btn" x="77" y="834">☰ Menu</text>
  <rect x="120" y="814" width="230" height="30" rx="15" fill="#f1f3f1"/>
  <text class="s" x="134" y="834" style="font-size:12px">Message</text>

  <!-- notes -->
  <text class="note nh" x="440" y="58">S5 → S6: revision round · S12: stale card</text>
  <text class="note b" x="440" y="88">S5 (while r3 is built), on the r2 card</text>
  <rect x="440" y="98" width="370" height="58" rx="12" fill="#ffffff" stroke="#c9d3c4"/>
  <text class="t b" x="452" y="118">✏️ Changes requested · c_01JABC · r2 → r3</text>
  <text class="t" x="452" y="138">✅ implement 6m · ⏳ validate · ⬜ review · ⬜ package</text>
  <text class="note" x="440" y="176">• Progress edits ≤ 1 per 5 s; keyboard = disabled</text>
  <text class="note" x="440" y="192">  "⛔ Not approvable" (Bot API 10.3, raw call).</text>

  <text class="note b" x="440" y="222">S6 rules</text>
  <text class="note" x="440" y="240">• Sent as a reply to the old card (tap → jump).</text>
  <text class="note" x="440" y="256">• "✅ touched" is deterministic: the interdiff</text>
  <text class="note" x="440" y="272">  changes the commented lines ±3 (or adds the</text>
  <text class="note" x="440" y="288">  file); else "⚠️ not touched".</text>
  <text class="note" x="440" y="306">• "You asked": ≤ 5 items × 80 chars, "🤖 coder:"</text>
  <text class="note" x="440" y="322">  ≤ 60; then "+N more → 🧭"; dropped first if long.</text>
  <text class="note" x="440" y="340">• Interdiff = INTERDIFF (same base) or RANGE_DIFF</text>
  <text class="note" x="440" y="356">  (base moved: file-level "touched" only, card says</text>
  <text class="note" x="440" y="372">  "line-level touch check unavailable").</text>
  <text class="note" x="440" y="390">• Display-only (U4): the binding is still the full</text>
  <text class="note" x="440" y="406">  derived patch + head SHA + title/body hashes.</text>

  <text class="note b" x="440" y="436">🔀 Interdiff view (same base: line comments work)</text>
  <rect x="440" y="446" width="370" height="138" rx="12" fill="#ffffff" stroke="#c9d3c4"/>
  <text class="t b" x="452" y="466">🔀 Interdiff r2 → r3 · web/src/export/trace.ts</text>
  <rect x="450" y="474" width="350" height="100" rx="6" fill="#f6f8fa"/>
  <text class="m" x="456" y="490">@@ -42,3 +42,3 @@ export function toOtel</text>
  <text class="m" x="456" y="505">     if (!t.spans?.length) {</text>
  <rect x="450" y="509" width="350" height="15" fill="#ffebe9"/>
  <text class="m del" x="456" y="520">-      log.debug('no spans', t.id);</text>
  <rect x="450" y="524" width="350" height="15" fill="#dafbe1"/>
  <text class="m add" x="456" y="535">+      log.warn('trace has no spans', t.id);</text>
  <text class="m" x="456" y="550">       return emptyExport(t.id);</text>
  <text class="s" x="456" y="568">file 1/2 · next: trace.test.ts (new, +18)</text>

  <text class="note b" x="440" y="614">S12 variants (label from the reason code)</text>
  <text class="note" x="440" y="632">⌛ Expired · valid 72 h → [🔁 Retry] (fresh card)</text>
  <text class="note" x="440" y="650">⚪ dry_run_toggled → "dry-run turned off" + current</text>
  <text class="note" x="440" y="668">⚪ config reloaded · title/body edited · kill · moved</text>
  <text class="note" x="440" y="686">• Body-part messages become "⚪ part of superseded</text>
  <text class="note" x="440" y="702">  c_01JABC r2", so stale bytes can't be mistaken.</text>
  <text class="note" x="440" y="720">• A tap on any old token: toast "Superseded: content</text>
  <text class="note" x="440" y="736">  or mode changed since this card; review the new card."</text>
  <text class="note" x="440" y="754">• "⬇️ Show current" re-sends the live card at the</text>
  <text class="note" x="440" y="770">  bottom via reissue() (N4); drafts survive.</text>
  <text class="note" x="440" y="800">Keyboard: 3 rows × 2 · labels ≤ 20 · 24-byte data.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="900" viewBox="0 0 1260 900" role="img" aria-labelledby="title desc">
  <title id="title">ossbot mockup: information architecture with private-chat topics and the command menu</title>
  <desc id="desc">Left phone: the bot's private chat in topic mode listing Control (pinned dashboard), Reviews with unread approval cards, OSS feed muted, Assistant, a user-created Nutrition topic and an older chat topic. Right phone: the Control topic with the owner-scoped command menu sheet opened from the menu button.</desc>
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif;font-size:12.5px;fill:#111}
    .b{font-weight:700}
    .s{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:10.5px;fill:#6f7f6f}
    .p{font-family:-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif;font-size:11.5px;fill:#6a6f68}
    .btn{font-family:-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif;font-size:12px;fill:#fff;font-weight:600;text-anchor:middle}
    .note{font-family:-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif;font-size:12px;fill:#222}
    .nh{font-size:15px;font-weight:700}
    .hdr{font-family:-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif;font-size:14px;font-weight:700;fill:#111}
    .cmd{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:12.5px;fill:#2f7fe0;font-weight:700}
    .ico{font-family:"Noto Color Emoji","Segoe UI Emoji",sans-serif;font-size:18px;text-anchor:middle}
  </style>

  <!-- ============ LEFT: topic list ============ -->
  <rect x="20" y="20" width="390" height="860" rx="46" fill="#1d1d1f"/>
  <rect x="30" y="30" width="370" height="840" rx="38" fill="#ffffff"/>
  <text x="58" y="54" class="t b">14:21</text>
  <circle cx="86" cy="93" r="17" fill="#2f7fe0"/>
  <text x="86" y="98" class="btn" style="font-size:13px">ob</text>
  <text x="112" y="90" class="hdr">ossbot</text>
  <text x="112" y="107" class="s">bot · 6 topics</text>
  <line x1="30" y1="120" x2="400" y2="120" stroke="#e1e6dd"/>

  <!-- rows -->
  <circle cx="64" cy="152" r="20" fill="#6FB9F0"/><text class="ico" x="64" y="158">🚦</text>
  <text class="t b" x="94" y="146">Control</text><text class="s" x="390" y="146" text-anchor="end">📌 14:20</text>
  <text class="p" x="94" y="164">🟢 UP · 🧪 DRY RUN · updated 1 min ago</text>
  <line x1="94" y1="184" x2="400" y2="184" stroke="#eef0ec"/>

  <circle cx="64" cy="216" r="20" fill="#8EEE98"/><text class="ico" x="64" y="222">✅</text>
  <text class="t b" x="94" y="210">Reviews</text><text class="s" x="350" y="210" text-anchor="end">14:12</text>
  <text class="p" x="94" y="228">🧩 Ready for review · c_01JABC · r2</text>
  <circle cx="378" cy="222" r="11" fill="#2f7fe0"/><text class="btn" x="378" y="226" style="font-size:11px">2</text>
  <line x1="94" y1="248" x2="400" y2="248" stroke="#eef0ec"/>

  <circle cx="64" cy="280" r="20" fill="#FFD67E"/><text class="ico" x="64" y="286">📈</text>
  <text class="t b" x="94" y="274">OSS feed 🔕</text><text class="s" x="350" y="274" text-anchor="end">13:58</text>
  <text class="p" x="94" y="292">📈 3 updates · CI passed on PR #5678</text>
  <circle cx="378" cy="286" r="11" fill="#b9c0b7"/><text class="btn" x="378" y="290" style="font-size:11px">3</text>
  <line x1="94" y1="312" x2="400" y2="312" stroke="#eef0ec"/>

  <circle cx="64" cy="344" r="20" fill="#CB86DB"/><text class="ico" x="64" y="350">💬</text>
  <text class="t b" x="94" y="338">Assistant</text><text class="s" x="390" y="338" text-anchor="end">Tue</text>
  <text class="p" x="94" y="356">Ephemeral resources in Terraform…</text>
  <line x1="94" y1="376" x2="400" y2="376" stroke="#eef0ec"/>

  <circle cx="64" cy="408" r="20" fill="#FF93B2"/><text class="ico" x="64" y="414">🍽</text>
  <text class="t b" x="94" y="402">Nutrition</text><text class="s" x="390" y="402" text-anchor="end">12:41</text>
  <text class="p" x="94" y="420">🍽 Meal logged · lunch · 82 / 140 g</text>
  <line x1="94" y1="440" x2="400" y2="440" stroke="#eef0ec"/>

  <circle cx="64" cy="472" r="20" fill="#FB6F5F"/><text class="ico" x="64" y="478">💬</text>
  <text class="t b" x="94" y="466">Chat 18 Oct 09:10</text><text class="s" x="390" y="466" text-anchor="end">09:14</text>
  <text class="p" x="94" y="484">Draft a reply to the maintainer about…</text>
  <line x1="94" y1="504" x2="400" y2="504" stroke="#eef0ec"/>

  <rect x="46" y="524" width="338" height="40" rx="12" fill="#eef4fd"/>
  <text class="t b" x="215" y="549" text-anchor="middle" style="fill:#2f7fe0">＋ New topic (a new chat with Hermes)</text>

  <text class="s" x="46" y="600">System topics are created by the gatekeeper at start</text>
  <text class="s" x="46" y="615">(createForumTopic) when getMe.has_topics_enabled is true;</text>
  <text class="s" x="46" y="630">thread ids are stored in tg_topics and re-checked.</text>
  <text class="s" x="46" y="652">Topics off → one flat chat; every message starts with</text>
  <text class="s" x="46" y="667">its section icon (🚦 ✅ 📈 🤖) so streams stay distinct.</text>

  <!-- ============ RIGHT: command menu ============ -->
  <rect x="440" y="20" width="390" height="860" rx="46" fill="#1d1d1f"/>
  <rect x="450" y="30" width="370" height="840" rx="38" fill="#d9e4c8"/>
  <rect x="450" y="30" width="370" height="88" rx="38" fill="#ffffff"/>
  <rect x="450" y="80" width="370" height="38" fill="#ffffff"/>
  <text x="478" y="54" class="t b">14:22</text>
  <circle cx="506" cy="93" r="17" fill="#2f7fe0"/>
  <text x="506" y="98" class="btn" style="font-size:13px">ob</text>
  <text x="532" y="90" class="hdr">ossbot</text>
  <text x="532" y="107" class="s">🚦 Control · bot</text>
  <line x1="450" y1="118" x2="820" y2="118" stroke="#d0d6cc"/>
  <rect x="450" y="118" width="370" height="150" fill="#c9d4b8"/>
  <text class="s" x="635" y="200" text-anchor="middle" style="fill:#4e5f4a">(chat dimmed while the menu is open)</text>

  <rect x="450" y="268" width="370" height="532" rx="18" fill="#ffffff"/>
  <rect x="610" y="278" width="50" height="5" rx="2.5" fill="#d0d4ce"/>
  <text class="t b" x="470" y="306">Menu</text>
  <text class="cmd" x="470" y="334">/status</text><text class="p" x="578" y="334">Full status and health</text>
  <text class="cmd" x="470" y="362">/dashboard</text><text class="p" x="578" y="362">Re-send and pin the dashboard</text>
  <text class="cmd" x="470" y="390">/queue</text><text class="p" x="578" y="390">Pending approvals, ranked</text>
  <text class="cmd" x="470" y="418">/review</text><text class="p" x="578" y="418">Open the explorer for a card</text>
  <text class="cmd" x="470" y="446">/pause</text><text class="p" x="578" y="446">Pause the pipeline now</text>
  <text class="cmd" x="470" y="474">/kill</text><text class="p" x="578" y="474">Soft kill now (stop everything)</text>
  <text class="cmd" x="470" y="502">/dryrun</text><text class="p" x="578" y="502">Show or change dry-run</text>
  <text class="cmd" x="470" y="530">/down</text><text class="p" x="578" y="530">Graceful down of workers…</text>
  <text class="cmd" x="470" y="558">/model</text><text class="p" x="578" y="558">Pick models per role</text>
  <text class="cmd" x="470" y="586">/new</text><text class="p" x="578" y="586">New assistant chat</text>
  <text class="cmd" x="470" y="614">/quiet</text><text class="p" x="578" y="614">Mute non-critical alerts</text>
  <text class="cmd" x="470" y="642">/settings</text><text class="p" x="578" y="642">Preferences</text>
  <text class="cmd" x="470" y="670">/help</text><text class="p" x="578" y="670">All commands</text>
  <text class="s" x="470" y="700">… ~30 commands total; scope = owner chat only</text>
  <text class="s" x="470" y="716">killed mode → /status /resume /logs /help /start</text>

  <rect x="450" y="800" width="370" height="70" fill="#ffffff"/>
  <rect x="462" y="814" width="70" height="30" rx="15" fill="#1f5fb8"/>
  <text class="btn" x="497" y="834">✕ Menu</text>
  <rect x="540" y="814" width="230" height="30" rx="15" fill="#f1f3f1"/>
  <text class="s" x="554" y="834" style="font-size:12px">Message</text>

  <!-- ============ NOTES ============ -->
  <text class="note nh" x="860" y="58">Information architecture (CR-003 §4)</text>
  <text class="note b" x="860" y="86">Topics (when enabled in @BotFather)</text>
  <text class="note" x="860" y="104">🚦 Control: dashboard (pinned), commands,</text>
  <text class="note" x="860" y="120">  P0 alerts, lifecycle summaries.</text>
  <text class="note" x="860" y="138">✅ Reviews: proposals, every approval card, explorer,</text>
  <text class="note" x="860" y="154">  files, draft review, Confirm, status card and</text>
  <text class="note" x="860" y="170">  drafted replies (replies can't cross topics).</text>
  <text class="note" x="860" y="188">📈 OSS feed: stage FYIs, batches, digests (silent).</text>
  <text class="note" x="860" y="206">💬 Assistant + your topics: one Hermes session</text>
  <text class="note" x="860" y="222">  each (tg-&lt;uid&gt;-t&lt;thread_id&gt;).</text>
  <text class="note b" x="860" y="252">Routing (first match wins)</text>
  <text class="note" x="860" y="270">1 callback → token · 2 stop-generation → stream ·</text>
  <text class="note" x="860" y="286">3 reply to an open prompt → that input (even "/…")</text>
  <text class="note" x="860" y="302">· 4 "/cmd" → registry · 5 reply to card/file/body/</text>
  <text class="note" x="860" y="318">proposal → comment or plan adjust · 6 GitHub link</text>
  <text class="note" x="860" y="334">→ 🔗 [🛠 Work on this] · 7 Reviews text → answer under</text>
  <text class="note" x="860" y="350">"🤖 Assistant · answer to your message", quoted, only</text>
  <text class="note" x="860" y="366">[📝 Use as comment] · 8 Control/feed text → answered</text>
  <text class="note" x="860" y="382">in 💬 Assistant · 9 rest → Hermes (topic). Unsolicited</text>
  <text class="note" x="860" y="398">Hermes messages: Assistant/user topics only (U12).</text>
  <text class="note" x="860" y="414">Authorization never depends on the topic (U10).</text>
  <text class="note b" x="860" y="444">Menu button and scopes</text>
  <text class="note" x="860" y="462">• MenuButtonCommands; setMyCommands only for</text>
  <text class="note" x="860" y="478">  BotCommandScopeChat(owner); Default = empty.</text>
  <text class="note" x="860" y="496">• Re-set on state change (killed hides /settings;</text>
  <text class="note" x="860" y="512">  down/draining add /up). Commands 1–32 [a-z0-9_]; ossbot</text>
  <text class="note" x="860" y="528">  descriptions ≤ 60 chars; ≤ 100 commands.</text>
  <text class="note" x="860" y="546">• Every argument has an inline picker; typed</text>
  <text class="note" x="860" y="562">  arguments are validated the same way.</text>
  <text class="note b" x="860" y="592">Sound per topic</text>
  <text class="note" x="860" y="610">Control: P0 loud, rest silent · Reviews: P1 loud,</text>
  <text class="note" x="860" y="626">≤ 2 new cards/hour · OSS feed: silent · Assistant:</text>
  <text class="note" x="860" y="642">normal replies. Quiet hours make P1 silent; P0</text>
  <text class="note" x="860" y="658">is never silenced (U7).</text>
  <text class="note b" x="860" y="688">Limits used</text>
  <text class="note" x="860" y="706">Topic names ≤ 48 chars (limit 128); icon colours</text>
  <text class="note" x="860" y="722">from the 6 allowed values; thread "not found" →</text>
  <text class="note" x="860" y="738">re-create once, then flat mode.</text>
  <text class="note" x="860" y="756">getMe().allows_users_to_create_topics false →</text>
  <text class="note" x="860" y="772">doctor warns; /new still creates topics itself.</text>
  <text class="note" x="860" y="790">Replies go to the originating topic (§4.1).</text>
</svg>

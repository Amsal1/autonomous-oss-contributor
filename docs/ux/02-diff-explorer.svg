  <!-- ============ NOTES ============ -->
  <text class="note nh" x="860" y="58">S2 explorer · S3 file · S4 comments</text>
  <text class="note" x="860" y="80">Both are sent as replies to the card, so the</text>
  <text class="note" x="860" y="96">quote header jumps back to it. No Approve here.</text>
  <text class="note b" x="860" y="124">Explorer (one message, edited in place)</text>
  <text class="note" x="860" y="142">1 Summary · 2 Why · 3 Signals · 4 Risk · 5 Files</text>
  <text class="note" x="860" y="158">6 Diff · 7 Tests · 8 Self-review · 9 PR text</text>
  <text class="note" x="860" y="176">• nav tokens: multi-use, 24 h, message-bound,</text>
  <text class="note" x="860" y="192">  24-byte callback_data; ≤ 3 per row.</text>
  <text class="note b" x="860" y="220">File view (one message per file)</text>
  <text class="note" x="860" y="238">• Rich: pre language="diff", details for hunks</text>
  <text class="note" x="860" y="254">  &gt; 60 lines; ≤ 30,000 chars / ≤ 450 blocks;</text>
  <text class="note" x="860" y="270">  skip_entity_detection = true (U1).</text>
  <text class="note" x="860" y="288">• Classic fallback: &lt;pre&gt;&lt;code class=</text>
  <text class="note" x="860" y="304">  "language-diff"&gt; pages ≤ 3,500 chars.</text>
  <text class="note" x="860" y="322">• Hunk text = derived patch bytes, with hidden</text>
  <text class="note" x="860" y="338">  and bidi characters shown as ⟦U+XXXX⟧.</text>
  <text class="note b" x="860" y="366">Comments</text>
  <text class="note" x="860" y="384">• Reply + quote: quote.text (≤ 1,024) searched in</text>
  <text class="note" x="860" y="400">  the page text → path + lines; ties broken by</text>
  <text class="note" x="860" y="416">  quote.position; ambiguous → line picker.</text>
  <text class="note" x="860" y="434">• 💬 Comment → hunk picker → ForceReply</text>
  <text class="note" x="860" y="450">  (placeholder ≤ 60 chars, text ≤ 4,000).</text>
  <text class="note b" x="860" y="480">Draft review (reply to card, edited in place)</text>

  <text class="note" x="860" y="684">• Send → one change_requests row (text +</text>
  <text class="note" x="860" y="700">  comments_json) → CHANGES_REQUESTED → S5.</text>
  <text class="note" x="860" y="718">• Mirror (opt-in) single comments join here,</text>
  <text class="note" x="860" y="734">  with source = mirror.</text>
  <text class="note" x="860" y="752">• While Confirm is armed, new comments wait; the</text>
  <text class="note" x="860" y="768">  Confirm panel warns they will be discarded.</text>
  <text class="note" x="860" y="796">Labels ≤ 20 chars; ≤ 2 per row when a label</text>
  <text class="note" x="860" y="812">is over 12 chars (so Send gets its own row).</text>

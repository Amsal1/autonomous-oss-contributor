  <text class="m add" x="476" y="297">+     log.debug('no spans', t.id);</text>
  <text class="m add" x="476" y="312">+     return emptyExport(t.id);</text>
  <text class="m add" x="476" y="327">+   }</text>
  <text class="m add" x="476" y="342">+   const spans = t.spans.map(conv);</text>
  <text class="m" x="476" y="357">    return { resourceSpans: spans };</text>

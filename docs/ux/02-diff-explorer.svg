  <text class="t" x="472" y="208">file 1/3 · +30 −5 · 2 hunks · r2</text>
  <text class="t b" x="472" y="228" style="font-size:11.5px">Hunk 1 · @@ -40,7 +40,12 @@ toOtel</text>
  <rect x="470" y="236" width="280" height="126" rx="6" fill="#f6f8fa"/>
  <text class="m" x="476" y="252">  export function toOtel(t: Trace) {</text>
  <rect x="470" y="256" width="280" height="15" fill="#ffebe9"/>

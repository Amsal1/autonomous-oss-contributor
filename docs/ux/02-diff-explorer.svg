  <title id="title">ossbot mockup S2–S4: explorer, file view, line comment and draft review</title>
  <desc id="desc">Left phone: the explorer message on section 3 of 9 (Signals) with its navigation keyboard and the section picker. Right phone: a per-file diff message with highlighted hunk, a collapsed hunk, the user's reply with a quote, and the comment acknowledgement. Notes show the draft-review message and the limits.</desc>

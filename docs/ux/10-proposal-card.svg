  <rect x="460" y="140" width="300" height="138" rx="16" fill="#ffffff" stroke="#9fb39a" stroke-dasharray="4 3"/>
  <text class="t b" x="472" y="158">💡 Proposal · c_01JABC · v2</text>
  <text class="t dry" x="472" y="173">🧪 DRY RUN (n/a: local change)</text>
  <text class="t b" x="472" y="191">Confirm: start work on langfuse/langfuse#1234</text>
  <text class="t b" x="472" y="206">(proposal v2 · est s · sha256 1a2b…9f0c).</text>
  <text class="t b" x="472" y="221">Local work only — dry-run does not apply;</text>
  <text class="t b" x="472" y="236">nothing is public before you approve the PR.</text>
  <text class="t" x="472" y="252">⏳ Expires <tspan class="b">in 5 minutes</tspan></text>
  <text class="s" x="472" y="268">single-use · 5 min · bound to this message</text>
  <rect x="460" y="282" width="148" height="30" rx="10" fill="#2f7fe0"/>

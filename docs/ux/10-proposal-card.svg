  <text class="s" x="58" y="157">⚪ Superseded · Proposal v1 · c_01JABC</text>
  <text class="t b" x="52" y="178">💡 Proposal · c_01JABC · v2</text>
  <text class="t dry" x="52" y="194">🧪 DRY RUN (n/a: local change)</text>
  <text class="t" x="52" y="210">👤 <tspan class="b">requested by you</tspan> · "keep it minimal"</text>
  <text class="t" x="52" y="226"><tspan class="b">langfuse/langfuse</tspan> ⭐ 36.0k · merge ~2 d</text>

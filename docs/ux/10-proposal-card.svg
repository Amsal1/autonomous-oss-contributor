  <text class="s" x="472" y="398">… repo, issue, checks, tests, self-review …</text>
  <rect x="468" y="404" width="284" height="64" rx="6" fill="#fff4e0"/>
  <text class="t warn" x="474" y="419"><tspan class="b">Size ⚠️ m (est s)</tspan> · est ~48 code →</text>
  <text class="t" x="474" y="434">+142 / −30 code · +210 test · 6 files</text>
  <text class="t warn" x="474" y="449">⚠️ <tspan class="b">+258% over estimate</tspan> · <tspan class="claim">🤖 coder: "the</tspan></text>
  <text class="t claim" x="474" y="463">empty payload needs a config migration"</text>
  <text class="t warn" x="472" y="483">⚠️ 2 files outside the plan: docs/export.md, …</text>

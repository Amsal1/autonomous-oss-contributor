  <text class="t" x="484" y="638">· 3,000 test</text>
  <text class="t" x="472" y="655">This guard stops runaway changes. Split the</text>
  <text class="t" x="472" y="670">work, or raise policy.diff in config/policy.yaml</text>
  <text class="t" x="472" y="685">and /reload. No button raises it.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="900" viewBox="0 0 1260 900" role="img" aria-labelledby="title desc">
  <title id="title">ossbot mockup: gate 1 proposal card, its Confirm, the size overrun highlight and the ceiling-hit card</title>
  <desc id="desc">Left phone: proposal version 2 for a user-requested issue, sent as a reply to the superseded version 1. It shows the mode badge marked not applicable, the requested-by-you badge, the repository and issue, a gatekeeper-computed list of what changed since version 1, the problem, three approach steps, likely files, the size estimate with code and test lines, the validation plan, signals, acceptance rationale, confidence, and the expiry, followed by a four-row keyboard: Start work and Skip, Adjust plan and Make it smaller, Never and Later, Details. Right phone: the card edited into the Start work confirm panel with a blue Confirm start button; later, a PR preview card excerpt where the measured size is larger than estimated and is highlighted with the percentage and the coder's labelled reason while Approve stays available; and a size-ceiling card with Split, Drop, Re-check and Explore buttons.</desc>
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif;font-size:11.5px;fill:#111}
    .b{font-weight:700}
    .m{font-family:"SF Mono",Consolas,"Roboto Mono",monospace;font-size:10.5px;fill:#1b1b1b;white-space:pre}
    .s{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:10px;fill:#6f7f6f}
    .btn{font-family:-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif;font-size:11.5px;fill:#fff;font-weight:600;text-anchor:middle}
    .dis{font-family:-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif;font-size:11.5px;fill:#f2f4f0;font-weight:600;text-anchor:middle}
    .note{font-family:-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif;font-size:12px;fill:#222}
    .nh{font-size:15px;font-weight:700}
    .hdr{font-family:-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif;font-size:14px;font-weight:700;fill:#111}
    .rq{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:10.5px;fill:#2f7fe0;font-weight:700}
    .claim{fill:#555;font-style:italic}
    .dry{fill:#0d47a1;font-weight:700}
    .warn{fill:#8a4b00}
    .add{fill:#116329}
    .del{fill:#a40e26}
    .link{fill:#1a6fd1}
    .ghost{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:10.5px;fill:#3f5a3f}
  </style>


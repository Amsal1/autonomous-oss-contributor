  <text class="t claim" x="64" y="428">2. Return an empty export payload</text>
  <text class="t claim" x="64" y="443">3. Gate the debug log behind a flag</text>
  <text class="t" x="52" y="460">🤖 Files <tspan class="m">trace.ts · trace.test.ts · config.ts</tspan></text>
  <text class="t" x="52" y="476"><tspan class="b">Size</tspan> 🤖 est <tspan class="b">s</tspan> · ~48 code · ~40 test · 3 files</text>
  <text class="t" x="52" y="491">👤 size preference not applied</text>
  <text class="t" x="52" y="507">Validate ✅ vitest found · T0 unit · 🤖 easy</text>

  <text class="t claim" x="52" y="539">🤖 Why it fits: maintainer asked for a PR</text>
  <text class="t" x="52" y="555">Confidence 🤖 0.78 · Risks 2 · Alt. 1 → 🧭</text>
  <text class="t" x="52" y="575">⏳ Proposal expires <tspan class="b">in 3 days</tspan></text>
  <text class="s" x="330" y="584" text-anchor="end">14:11</text>


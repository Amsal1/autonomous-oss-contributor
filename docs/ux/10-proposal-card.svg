  <!-- ============ NOTES ============ -->
  <text class="note nh" x="860" y="58">Gate 1 · proposal card (CR-004, CR-003 §5.15)</text>
  <text class="note" x="860" y="80">A bound decision surface like the PR card (U3):</text>
  <text class="note" x="860" y="96">classic HTML, never rich, never a draft; Start work</text>
  <text class="note" x="860" y="112">exists only on the card. ✅ = gatekeeper fact,</text>
  <text class="note" x="860" y="128">🤖 = scout claim (quoted, untrusted, U6).</text>
  <text class="note b" x="860" y="156">Telegram constraints</text>
  <text class="note" x="860" y="174">• Card ≈ 1,250 chars; budget ≤ 3,900 escaped (limit</text>
  <text class="note" x="860" y="190">  4,096). Overflow drops Signals, then rationale, then</text>
  <text class="note" x="860" y="206">  bullets after 3; header, mode, issue, size and</text>
  <text class="note" x="860" y="222">  expiry are never cut.</text>
  <text class="note" x="860" y="240">• 4 rows · ≤ 2 per row · labels ≤ 24 ("🙋 Ask</text>
  <text class="note" x="860" y="256">  maintainers first" = 24, "✂️ Split (adjust plan)" = 22).</text>
  <text class="note" x="860" y="274">• callback_data = "t:" + 22 chars = 24 bytes.</text>
  <text class="note" x="860" y="290">• Field bounds: problem ≤ 300, ≤ 6 steps × 100,</text>
  <text class="note" x="860" y="306">  ≤ 4 paths × 60, rationale ≤ 160; rest in 🧭 Details.</text>
  <text class="note b" x="860" y="334">Buttons</text>
  <text class="note" x="860" y="352">• Start work → Confirm (two taps, 5 min, binds version</text>
  <text class="note" x="860" y="368">  + proposal hash + est class); primary: widens nothing.</text>
  <text class="note" x="860" y="384">  CLA / open-PR warnings are added to this panel.</text>
  <text class="note" x="860" y="402">• Adjust plan → ForceReply (≤ 2,000) or reply to the</text>
  <text class="note" x="860" y="418">  card; Make it smaller → "fit the next class".</text>
  <text class="note" x="860" y="436">• Skip / Later: reject (Start work dies) + Undo ≤ 10 min</text>
  <text class="note" x="860" y="452">  → fresh card, same expiry; Never: confirm, no Undo.</text>
  <text class="note" x="860" y="468">• Details: one reply message, no decision buttons.</text>
  <text class="note b" x="860" y="480">Versions (§5.16)</text>
  <text class="note" x="860" y="498">• v(N+1) replies to vN; vN goes ⚪ Superseded.</text>
  <text class="note" x="860" y="514">• "Changed since" is a field-by-field diff of the two</text>
  <text class="note" x="860" y="530">  stored proposals: ≤ 6 lines × 100, then "+N → 🧭".</text>
  <text class="note b" x="860" y="558">Order and sound in ✅ Reviews (§5.13)</text>
  <text class="note" x="860" y="576">• 👤 items: class 1, loud. Previews (gate 2): class 3.</text>
  <text class="note" x="860" y="592">• Autonomous proposals: class 4, silent, ≤ 3 per cycle,</text>
  <text class="note" x="860" y="608">  ≤ 5/day; within 6 h of expiry → class 2.</text>
  <text class="note b" x="860" y="636">Size (CR-004 Amendment B)</text>
  <text class="note" x="860" y="654">• Test lines are shown apart, never counted.</text>
  <text class="note" x="860" y="670">• Overrun is highlighted with % and the coder's 🤖</text>
  <text class="note" x="860" y="686">  reason; Approve stays (default on_overrun: flag).</text>
  <text class="note" x="860" y="702">• RESCOPE_REQUIRED card only with on_overrun:</text>
  <text class="note" x="860" y="718">  reapprove: [✅ Continue at m] [📏 Make it smaller]</text>
  <text class="note" x="860" y="734">  [🧭 Explore] [🗑 Drop].</text>
  <text class="note" x="860" y="752">• Ceiling: config-only (U13); Re-check re-runs the size</text>
  <text class="note" x="860" y="768">  check. Split: fixed feedback + optional ForceReply.</text>
  <text class="note" x="860" y="786">• Overrun % = round(100 × (code − est) / est), code =</text>
  <text class="note" x="860" y="802">  added + deleted code: (172 − 48) / 48 → +258%. est 0</text>
  <text class="note" x="860" y="818">  → "est 0 code"; ⚠️ when code > est × (1 + tolerance)</text>
  <text class="note" x="860" y="834">  or the measured class is larger.</text>
  <text class="note" x="860" y="852">• Never… → [🚫 This repo] [🚫 Kind: Bug] (≤ 24); the</text>
  <text class="note" x="860" y="868">  confirm names the kind in full.</text>
</svg>

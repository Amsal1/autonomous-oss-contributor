  <text x="86" y="98" class="btn" style="font-size:13px">ob</text>
  <text x="112" y="90" class="hdr">ossbot</text>
  <text x="112" y="107" class="s">💬 Assistant · bot</text>
  <line x1="30" y1="118" x2="400" y2="118" stroke="#d0d6cc"/>

  <rect x="130" y="128" width="260" height="52" rx="16" fill="#e1ffc7"/>
  <text class="t" x="142" y="148">How do ephemeral resources work in</text>
  <text class="t" x="142" y="166">Terraform, and when should I use them?</text>

  <text class="ghost" x="40" y="198">streaming draft · sendRichMessageDraft · not persisted</text>
  <rect x="40" y="206" width="300" height="70" rx="16" fill="#ffffff" stroke="#9fb39a" stroke-dasharray="4 3"/>
  <text class="t" x="52" y="226">🔎 Searching the web (2) · 📄 Reading</text>
  <text class="t" x="52" y="244">developer.hashicorp.com</text>
  <text class="t" x="52" y="264">Ephemeral resources are values that ▍</text>
  <rect x="282" y="252" width="50" height="20" rx="10" fill="#e9eef8"/>
  <text class="s" x="307" y="266" text-anchor="middle" style="fill:#2f7fe0;font-weight:700">■ Stop</text>

  <text class="ghost" x="40" y="296">↓ final message (sendRichMessage, blocks mode)</text>
  <rect x="40" y="304" width="300" height="296" rx="16" fill="#ffffff"/>
  <text class="hdr" x="52" y="326">Ephemeral resources in Terraform</text>
  <text class="t" x="52" y="348">• Values exist only during a run; they are</text>
  <text class="t" x="52" y="366">  never written to plan or state.</text>
  <text class="t" x="52" y="384">• Use them for short-lived secrets and tokens.</text>
  <text class="t" x="52" y="402">• Pair with write-only arguments to pass a</text>
  <text class="t" x="52" y="420">  secret into a resource.</text>
  <rect x="50" y="430" width="280" height="56" rx="6" fill="#f6f8fa"/>
  <text class="s" x="56" y="442">hcl</text>
  <text class="m" x="56" y="458">ephemeral "random_password" "db" {</text>
  <text class="m" x="56" y="472">  length = 24</text>
  <text class="m" x="56" y="484">}</text>
  <text class="t" x="52" y="506">They can't be referenced by arguments that</text>
  <text class="t" x="52" y="524">are stored in state.</text>
  <rect x="50" y="534" width="280" height="24" rx="6" fill="#eef1ec"/>
  <text class="t" x="58" y="551">▸ Sources (3)</text>
  <text class="s" x="52" y="580">🧠 sonnet-5.5 · 🔎 2 · 📄 3 · 14 s</text>
  <text class="s" x="330" y="594" text-anchor="end">20:05</text>
  <rect x="40" y="606" width="300" height="32" rx="10" fill="#5f7d64"/>
  <text class="btn" x="190" y="626">Show a full example</text>
  <rect x="40" y="642" width="300" height="32" rx="10" fill="#5f7d64"/>
  <text class="btn" x="190" y="662">Compare with OpenTofu</text>
  <rect x="40" y="678" width="300" height="32" rx="10" fill="#5f7d64"/>
  <text class="btn" x="190" y="698">When not to use them</text>

  <rect x="30" y="800" width="370" height="70" fill="#ffffff"/>
  <rect x="42" y="814" width="70" height="30" rx="15" fill="#2f7fe0"/>
  <text class="btn" x="77" y="834">☰ Menu</text>
  <rect x="120" y="814" width="230" height="30" rx="15" fill="#f1f3f1"/>
  <text class="s" x="134" y="834" style="font-size:12px">Message</text>


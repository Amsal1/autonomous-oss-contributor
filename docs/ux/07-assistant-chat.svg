  <rect x="440" y="20" width="390" height="860" rx="46" fill="#1d1d1f"/>
  <rect x="450" y="30" width="370" height="840" rx="38" fill="#d9e4c8"/>
  <rect x="450" y="30" width="370" height="88" rx="38" fill="#ffffff"/>
  <rect x="450" y="80" width="370" height="38" fill="#ffffff"/>
  <text x="478" y="54" class="t b">12:41</text>
  <circle cx="506" cy="93" r="17" fill="#2f7fe0"/>
  <text x="506" y="98" class="btn" style="font-size:13px">ob</text>
  <text x="532" y="90" class="hdr">ossbot</text>
  <text x="532" y="107" class="s">💬 Nutrition · bot (your topic)</text>
  <line x1="450" y1="118" x2="820" y2="118" stroke="#d0d6cc"/>

  <rect x="590" y="128" width="220" height="132" rx="16" fill="#e1ffc7"/>
  <rect x="598" y="136" width="204" height="90" rx="10" fill="#c6d1bc"/>
  <text class="t" x="700" y="186" text-anchor="middle">📷 photo · lunch tray</text>
  <text class="t" x="602" y="246">lunch — how much protein?</text>
  <rect x="566" y="236" width="34" height="24" rx="12" fill="#ffffff" stroke="#c9d3c4"/>
  <text class="t" x="583" y="253" text-anchor="middle">👌</text>

  <rect x="460" y="272" width="300" height="250" rx="16" fill="#ffffff"/>
  <text class="t b" x="472" y="294" style="font-size:11.5px">🍽 Meal logged · lunch · 12:40 · 🤖 assistant</text>
  <rect x="470" y="304" width="280" height="22" fill="#eef1ec"/>
  <text class="tc b" x="476" y="319">item</text>
  <text class="tc b" x="606" y="319">g</text>
  <text class="tc b" x="644" y="319">protein</text>
  <text class="tc b" x="712" y="319">kcal</text>
  <text class="tc" x="476" y="341">chicken breast</text>
  <text class="tc" x="606" y="341">150</text>
  <text class="tc" x="644" y="341">46 g</text>
  <text class="tc" x="712" y="341">248</text>
  <text class="tc" x="476" y="361">rice</text>
  <text class="tc" x="606" y="361">180</text>
  <text class="tc" x="644" y="361">5 g</text>
  <text class="tc" x="712" y="361">234</text>
  <text class="tc" x="476" y="381">broccoli</text>
  <text class="tc" x="606" y="381">80</text>
  <text class="tc" x="644" y="381">2 g</text>
  <text class="tc" x="712" y="381">27</text>
  <line x1="470" y1="389" x2="750" y2="389" stroke="#d6ddd2"/>
  <text class="tc b" x="476" y="405">total</text>
  <text class="tc b" x="644" y="405">53 g</text>
  <text class="tc b" x="712" y="405">509</text>
  <text class="t" x="472" y="430">Today: protein ▰▰▰▰▰▰▱▱▱▱ 82 / 140 g</text>
  <text class="t" x="472" y="448">kcal 1,640 / 2,300</text>
  <text class="t claim" x="472" y="470">🤖 estimate from photo · confidence medium</text>
  <text class="s" x="472" y="494">👁 vision: sonnet-5.5 · feature: nutrition v1</text>
  <text class="s" x="750" y="514" text-anchor="end">12:41</text>
  <rect x="460" y="528" width="97" height="32" rx="10" fill="#5f7d64"/>
  <text class="btn" x="508" y="548">✏️ Fix</text>

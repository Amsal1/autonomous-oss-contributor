  <rect x="450" y="800" width="370" height="70" fill="#ffffff"/>
  <rect x="462" y="814" width="70" height="30" rx="15" fill="#2f7fe0"/>
  <text class="btn" x="497" y="834">☰ Menu</text>
  <rect x="540" y="814" width="230" height="30" rx="15" fill="#f1f3f1"/>
  <text class="s" x="554" y="834" style="font-size:12px">Message</text>

  <!-- ============ NOTES ============ -->
  <text class="note nh" x="860" y="58">Assistant (Hermes via the gatekeeper)</text>
  <text class="note b" x="860" y="86">Streaming</text>
  <text class="note" x="860" y="104">• Draft within 1 s ("Thinking…"), then ≤ 1 per s,</text>
  <text class="note" x="860" y="120">  heartbeat ≤ 20 s (a draft lives 30 s); coalesced,</text>
  <text class="note" x="860" y="136">  never queued in tg_outbox; yields to cards.</text>
  <text class="note" x="860" y="154">• can_stop → stopped_message_generation → Hermes</text>
  <text class="note" x="860" y="170">  run stopped; partial saved with "⏹ Stopped by you".</text>
  <text class="note" x="860" y="188">• Status line = tool names + domains only; never</text>
  <text class="note" x="860" y="204">  arguments, results or reasoning.</text>
  <text class="note b" x="860" y="232">Rendering (U1)</text>
  <text class="note" x="860" y="250">• Hermes Markdown → our md2blocks → rich blocks of</text>
  <text class="note" x="860" y="266">  plain strings, skip_entity_detection = true. No</text>
  <text class="note" x="860" y="282">  Telegram markdown/html mode, no tg-button, no</text>
  <text class="note" x="860" y="298">  tg:// links, no media from model URLs.</text>
  <text class="note" x="860" y="316">• Sources: ≤ 8, deduped, in a closed details block.</text>
  <text class="note" x="860" y="332">  Rich answers have no link preview at all.</text>
  <text class="note" x="860" y="350">• Footer: model actually used (runtime.model),</text>
  <text class="note" x="860" y="366">  ⚠️ when it is a fallback.</text>
  <text class="note b" x="860" y="394">Follow-ups (U2, D9)</text>
  <text class="note" x="860" y="412">• ≤ 3, one per row; label = the exact text sent,</text>
  <text class="note" x="860" y="428">  ≤ 64 (longer: dropped); no "/…", no approval words.</text>
  <text class="note" x="860" y="446">• Tap → "↪️ text" echoed first → then sent to Hermes</text>
  <text class="note" x="860" y="462">  (origin followup_tap). Never reaches the registry.</text>
  <text class="note b" x="860" y="490">Media</text>
  <text class="note" x="860" y="508">• 👀 reaction on receipt → 👌 when answered (bots</text>
  <text class="note" x="860" y="524">  may set one reaction per message).</text>
  <text class="note" x="860" y="542">• Metadata stripped by a walker that never decodes</text>
  <text class="note" x="860" y="558">  pixels; files JPEG/PNG/WebP ≤ 5 MB; albums 1.5 s.</text>
  <text class="note b" x="860" y="586">Feature cards (D10)</text>
  <text class="note" x="860" y="604">• Hermes calls ossbot_feature_card(feature, kind,</text>
  <text class="note" x="860" y="620">  data); the gatekeeper validates (pydantic, extra=</text>
  <text class="note" x="860" y="636">  forbid) and renders with the kit; 🤖-prefixed, only</text>
  <text class="note" x="860" y="652">  in the turn's own Assistant/user topic (U12).</text>
  <text class="note" x="860" y="670">• Rich table ≤ 12 columns; card ≤ 30,000 chars.</text>
  <text class="note" x="860" y="688">• Topics: each user topic is its own Hermes</text>
  <text class="note" x="860" y="704">  session (tg-&lt;uid&gt;-t&lt;thread_id&gt;); /new adds one.</text>
  <text class="note" x="860" y="722">• Flat mode: 🤖 header on every assistant message.</text>
</svg>

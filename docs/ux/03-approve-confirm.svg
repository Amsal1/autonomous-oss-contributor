<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="900" viewBox="0 0 1260 900" role="img" aria-labelledby="title desc">
  <title id="title">ossbot mockup S8: Approve then Confirm, DRY RUN and LIVE</title>
  <desc id="desc">Two phones. Left: the card edited in place into the DRY RUN Confirm panel with a blue banner and a primary Confirm dry run button, then the dry-run-done state. Right: the LIVE Confirm panel with a red banner, a review-coverage warning, an unsent-comment warning, a red Confirm LIVE button, then the submitting progress and the submitted state.</desc>

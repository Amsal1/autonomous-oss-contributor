  <!-- ============ NOTES ============ -->
  <text class="note nh" x="860" y="58">S8 · Approve → Confirm (two taps)</text>
  <text class="note" x="860" y="80">Tap 1 (Approve) edits the card in place into</text>
  <text class="note" x="860" y="96">this panel; tap 2 (Confirm) starts submission.</text>
  <text class="note b" x="860" y="126">Safety (unchanged core, S1–S3)</text>
  <text class="note" x="860" y="146">• Confirm token: single-use, 5 min TTL, bound to</text>
  <text class="note" x="860" y="162">  this message id, owner + private chat only.</text>
  <text class="note" x="860" y="180">• The sentence is the DESIGN §12.4 string,</text>
  <text class="note" x="860" y="196">  computed now; dry_run recomputed at Approve,</text>
  <text class="note" x="860" y="212">  at Confirm and before every write.</text>
  <text class="note" x="860" y="230">• Any toggle, reload, edit or new rev between the</text>
  <text class="note" x="860" y="246">  taps → "Superseded: content or mode changed".</text>
  <text class="note" x="860" y="264">• Refused while paused, killed, draining or down,</text>
  <text class="note" x="860" y="280">  with a toast; nothing changes state.</text>
  <text class="note b" x="860" y="310">Presentation</text>
  <text class="note" x="860" y="330">• Banner and button state the mode in words;</text>
  <text class="note" x="860" y="346">  colour repeats it (primary blue / danger red).</text>
  <text class="note" x="860" y="364">• "Reviewed …" comes from tg_views opens; it is</text>
  <text class="note" x="860" y="380">  informational and never gates Confirm.</text>
  <text class="note" x="860" y="398">• Unsent draft-review comments are listed; on</text>
  <text class="note" x="860" y="414">  Confirm they are marked discarded.</text>
  <text class="note" x="860" y="432">• Cancel → S1 with rotated tokens ("Cancelled; nothing</text>
  <text class="note" x="860" y="448">  was submitted."). No tap in 5 min → housekeeping</text>
  <text class="note" x="860" y="464">  disarm_expired(): pending again, S1, fresh tokens.</text>
  <text class="note b" x="860" y="494">Telegram constraints</text>
  <text class="note" x="860" y="514">• Classic message ≤ 3,900 escaped chars; never</text>
  <text class="note" x="860" y="530">  a rich message, draft or ephemeral (U3).</text>
  <text class="note" x="860" y="548">• 2 buttons, 1 row; labels ≤ 20 chars.</text>
  <text class="note" x="860" y="566">• Toasts via answerCallbackQuery: limit 200, ossbot</text>
  <text class="note" x="860" y="582">  ≤ 180; show_alert only for refusals.</text>
  <text class="note" x="860" y="600">• "in 5 minutes" is &lt;tg-time format="r"&gt;.</text>
  <text class="note" x="860" y="618">• URL buttons (Open PR) and copy_text (Copy</text>
  <text class="note" x="860" y="634">  link, ≤ 256) need no token.</text>
  <text class="note b" x="860" y="664">Other action kinds</text>
  <text class="note" x="860" y="684">push_update: "Confirm: LIVE — push 1 commit to</text>
  <text class="note" x="860" y="700">PR #5678 (langfuse/langfuse) as Amsal1."</text>
  <text class="note" x="860" y="718">comment / claim: "Confirm: LIVE — post comment</text>
  <text class="note" x="860" y="734">on langfuse/langfuse#1234 as Amsal1."</text>
  <text class="note" x="860" y="752">skill / proposal start: local change, "dry-run does</text>
  <text class="note" x="860" y="768">not apply" (mockups 08 and 10).</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="820" height="900" viewBox="0 0 820 900" role="img" aria-labelledby="title desc">
  <title id="title">ossbot mockup S1: PR preview card</title>
  <desc id="desc">Telegram phone screen in the Reviews topic showing the decorated approval card with mode badge, verified facts, model claims, the size estimate versus the measured diff with code and test lines split, expiry, a four-row inline keyboard and the first verbatim PR body part. Notes add that the PR title is publish bytes: shown escaped, scanned for secrets but never redacted or defused, and copied unchanged by Copy title.</desc>
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif;font-size:12.5px;fill:#111}
    .b{font-weight:700}
    .i{font-style:italic}
    .m{font-family:"SF Mono",Consolas,"Roboto Mono",monospace;font-size:11px;fill:#1b1b1b;white-space:pre}
    .s{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:10.5px;fill:#6f7f6f}
    .btn{font-family:-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif;font-size:12px;fill:#fff;font-weight:600;text-anchor:middle}
    .note{font-family:-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif;font-size:12px;fill:#222}
    .nh{font-size:15px;font-weight:700}
    .claim{fill:#555;font-style:italic}
    .dry{fill:#1565c0;font-weight:700}
    .link{fill:#1a6fd1}
    .warn{fill:#8a4b00}
    .hdr{font-family:-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif;font-size:14px;font-weight:700;fill:#111}
  </style>
  <!-- phone -->
  <rect x="20" y="20" width="390" height="860" rx="46" fill="#1d1d1f"/>
  <rect x="30" y="30" width="370" height="840" rx="38" fill="#d9e4c8"/>
  <rect x="30" y="30" width="370" height="88" rx="38" fill="#ffffff"/>
  <rect x="30" y="80" width="370" height="38" fill="#ffffff"/>
  <text x="58" y="54" class="t b">9:41</text>
  <text x="372" y="54" class="t" text-anchor="end">5G ▮▮▮ 82%</text>
  <text x="46" y="98" class="t" style="fill:#2f7fe0;font-size:20px">‹</text>
  <circle cx="86" cy="93" r="17" fill="#2f7fe0"/>
  <text x="86" y="98" class="btn" style="font-size:13px">ob</text>
  <text x="112" y="90" class="hdr">ossbot</text>
  <text x="112" y="107" class="s">✅ Reviews · bot</text>
  <line x1="30" y1="118" x2="400" y2="118" stroke="#d0d6cc"/>

  <!-- card bubble -->
  <rect x="40" y="128" width="300" height="332" rx="16" fill="#ffffff"/>
  <text class="t" x="52" y="148"><tspan class="b">🧩 Ready for review</tspan> · c_01JABC · r2</text>
  <text class="t dry" x="52" y="166">🧪 DRY RUN — nothing is published</text>
  <text class="t" x="52" y="184"><tspan class="b">langfuse/langfuse</tspan> ⭐ 36.0k · 14 ext PRs/90d</text>
  <text class="t" x="52" y="202">Issue <tspan class="link">#1234</tspan> <tspan class="b">Fix trace export when</tspan></text>
  <text class="t" x="52" y="220"><tspan class="b">spans are empty</tspan> · bug, good first issue</text>
  <text class="t claim" x="52" y="238">🤖 Why: export crashes on empty span</text>
  <text class="t claim" x="52" y="256">lists; maintainer confirmed in thread.</text>
  <text class="t" x="52" y="274">✅ CONTRIBUTING · AI policy · DCO signed</text>
  <text class="t" x="52" y="292">✅ unclaimed · no competing PR</text>
  <text class="t" x="52" y="310">Risk 🤖 low (0.82) · Change ✅ 3 files</text>
  <text class="t" x="52" y="328"><tspan class="b">Size ✅ s</tspan> · est ~40 code → +31 / −7 code</text>
  <text class="t" x="64" y="346">· +11 test · within estimate</text>
  <text class="t" x="52" y="364">Tests ✅ lint · unit 212 · smoke</text>
  <text class="t" x="52" y="382">Self-review 🤖 PASS · 0 blocking · 2 nits</text>
  <text class="t" x="52" y="400">Commit <tspan class="m">abc1234</tspan> on main@def5678 (10:02)</text>
  <text class="t" x="52" y="418">PR title: <tspan class="m">fix(web): handle empty spans…</tspan></text>
  <text class="t" x="52" y="436">Body 2,140 chars (1 part ↓) · 0 hidden chars</text>
  <text class="t" x="52" y="453">⏳ Approval expires <tspan class="b">in 3 days</tspan></text>
  <text class="s" x="330" y="453" text-anchor="end">10:14</text>

  <!-- keyboard -->
  <rect x="40" y="466" width="148" height="32" rx="10" fill="#2e9d4f"/>
  <text class="btn" x="114" y="486">✅ Approve &amp; Submit</text>
  <rect x="192" y="466" width="148" height="32" rx="10" fill="#5f7d64"/>
  <text class="btn" x="266" y="486">❌ Reject</text>
  <rect x="40" y="502" width="148" height="32" rx="10" fill="#5f7d64"/>
  <text class="btn" x="114" y="522">🧭 Explore</text>
  <rect x="192" y="502" width="148" height="32" rx="10" fill="#5f7d64"/>
  <text class="btn" x="266" y="522">🧾 Files (3)</text>
  <rect x="40" y="538" width="148" height="32" rx="10" fill="#5f7d64"/>
  <text class="btn" x="114" y="558">✏️ Request changes</text>
  <rect x="192" y="538" width="148" height="32" rx="10" fill="#5f7d64"/>
  <text class="btn" x="266" y="558">📝 Edit text</text>
  <rect x="40" y="574" width="300" height="32" rx="10" fill="#5f7d64"/>
  <text class="btn" x="190" y="594">🐙 Review on GitHub</text>
  <text class="btn" x="330" y="586" style="font-size:10px">↗</text>

  <!-- body part bubble -->
  <rect x="40" y="616" width="300" height="172" rx="16" fill="#ffffff"/>
  <text class="t b" x="52" y="636">PR body (1/1)</text>
  <rect x="50" y="644" width="280" height="126" rx="6" fill="#eef1ec"/>
  <text class="m" x="58" y="661">## Summary</text>
  <text class="m" x="58" y="676">Handle empty span lists in the OTel</text>
  <text class="m" x="58" y="691">trace exporter so export no longer</text>
  <text class="m" x="58" y="706">throws on traces without spans.</text>
  <text class="m" x="58" y="721">Fixes #1234</text>
  <text class="m" x="58" y="736">## How this was validated</text>
  <text class="m" x="58" y="751">- unit: 212 passed (pnpm test)</text>
  <text class="m" x="58" y="766">&lt;!-- AI disclosure … --&gt;</text>
  <text class="s" x="330" y="782" text-anchor="end">10:14</text>

  <!-- input bar -->
  <rect x="30" y="800" width="370" height="70" fill="#ffffff"/>
  <rect x="42" y="814" width="70" height="30" rx="15" fill="#2f7fe0"/>
  <text class="btn" x="77" y="834">☰ Menu</text>
  <rect x="120" y="814" width="230" height="30" rx="15" fill="#f1f3f1"/>
  <text class="s" x="134" y="834" style="font-size:12px">Message</text>
  <text class="t" x="372" y="834" text-anchor="middle">🎙</text>

  <!-- notes -->
  <text class="note nh" x="440" y="58">S1 · Preview card (classic HTML)</text>
  <text class="note" x="440" y="80">The bound approval surface (U3). Never rich,</text>
  <text class="note" x="440" y="96">never a draft, never ephemeral.</text>
  <text class="note b" x="440" y="124">Telegram constraints</text>
  <text class="note" x="440" y="142">• Card text ≈ 1,560 chars; limit 4,096, ossbot</text>
  <text class="note" x="440" y="158">  budget ≤ 3,900 escaped chars (optional blocks</text>
  <text class="note" x="440" y="174">  dropped first; header, mode, title, size, expiry</text>
  <text class="note" x="440" y="190">  never cut).</text>
  <text class="note" x="440" y="208">• 4 rows · ≤ 2 per row · labels ≤ 24 (target 20).</text>
  <text class="note" x="440" y="226">• callback_data = "t:" + 22 chars = 24 bytes</text>
  <text class="note" x="440" y="242">  (limit 1–64); args live in ui_tokens.</text>
  <text class="note" x="440" y="260">• Row 4 is a URL button (no token), shown only with</text>
  <text class="note" x="440" y="276">  the mirror; a late push adds it by editing the</text>
  <text class="note" x="440" y="292">  markup with the same tokens.</text>
  <text class="note" x="440" y="310">• Approve is styled success and still says "Approve".</text>
  <text class="note b" x="440" y="338">Size line (CR-004 Amendment B)</text>
  <text class="note" x="440" y="356">• Gatekeeper numstat; test lines shown apart and</text>
  <text class="note" x="440" y="372">  never counted toward the class.</text>
  <text class="note" x="440" y="390">• Overrun (default on_overrun: flag) is highlighted,</text>
  <text class="note" x="440" y="406">  never blocked, e.g. "Size ⚠️ m (est s) … +330%</text>
  <text class="note" x="440" y="422">  over estimate · 🤖 coder: …" (see mockup 10).</text>
  <text class="note" x="440" y="440">• 👤 requested by you appears under the header for</text>
  <text class="note" x="440" y="456">  /work items.</text>
  <text class="note b" x="440" y="484">Behaviour</text>
  <text class="note" x="440" y="502">• Delivering: one disabled [⏳ delivering 1/2…], no</text>
  <text class="note" x="440" y="518">  tokens; Approve minted after delivery (unchanged).</text>
  <text class="note" x="440" y="536">• ✅ = verified by the gatekeeper; 🤖 = model claim.</text>
  <text class="note" x="440" y="553">• "in 3 days" is &lt;tg-time format="r"&gt;.</text>
  <text class="note" x="440" y="570">• Loud only within 2 cards/hour or class 0–1.</text>
  <text class="note" x="440" y="588">• Issue title: escaped, made visible, defused (U8).</text>
  <text class="note" x="440" y="604">• PR title = publish bytes: escaped in &lt;code&gt;, scanned,</text>
  <text class="note" x="440" y="620">  never defused or redacted (U14); a hit withholds</text>
  <text class="note" x="440" y="636">  the card. 📋 Copy title copies it unchanged.</text>
  <text class="note b" x="440" y="654">📝 Edit text → picker (reply to card)</text>
  <rect x="440" y="660" width="172" height="30" rx="9" fill="#5f7d64"/>
  <text class="btn" x="526" y="679">✏️ Title</text>
  <rect x="616" y="660" width="172" height="30" rx="9" fill="#5f7d64"/>
  <text class="btn" x="702" y="679">✏️ Body</text>
  <rect x="440" y="694" width="172" height="30" rx="9" fill="#5f7d64"/>
  <text class="btn" x="526" y="713">📄 Body as file</text>
  <rect x="616" y="694" width="172" height="30" rx="9" fill="#5f7d64"/>
  <text class="btn" x="702" y="713">📋 Copy title</text>
  <rect x="440" y="728" width="348" height="30" rx="9" fill="#5f7d64"/>
  <text class="btn" x="614" y="747">↩️ Clear my edits</text>
  <text class="note" x="440" y="778">• Body as file: .md/.txt ≤ 64 KiB, strict UTF-8. Any</text>
  <text class="note" x="440" y="794">  accepted edit → new card; this one turns stale.</text>
  <text class="note" x="440" y="822">Mode badge flips to "🔴 LIVE — opens a public PR"</text>
  <text class="note" x="440" y="838">when dry-run is off; any toggle re-issues cards.</text>
</svg>

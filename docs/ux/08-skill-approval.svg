<svg xmlns="http://www.w3.org/2000/svg" width="840" height="900" viewBox="0 0 840 900" role="img" aria-labelledby="title desc">
  <title id="title">ossbot mockup: self_improve skill approval card</title>
  <desc id="desc">A skill approval card in the Reviews topic listing the skill name, version, requesting tier, labelled model reason, requested tools checked against the tier, files and sizes, deterministic checks and hash, with the mode badge marked not applicable for a local change; the verbatim SKILL.md part; and the Confirm panel shown after Approve, whose sentence says dry-run does not apply and whose red Activate skill button is styled danger.</desc>
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif;font-size:12.5px;fill:#111}
    .b{font-weight:700}
    .m{font-family:"SF Mono",Consolas,"Roboto Mono",monospace;font-size:11px;fill:#1b1b1b;white-space:pre}
    .s{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:10.5px;fill:#6f7f6f}
    .btn{font-family:-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif;font-size:12px;fill:#fff;font-weight:600;text-anchor:middle}
    .note{font-family:-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif;font-size:12px;fill:#222}
    .nh{font-size:15px;font-weight:700}
    .hdr{font-family:-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif;font-size:14px;font-weight:700;fill:#111}
    .claim{fill:#555;font-style:italic}
    .warn{fill:#8a4b00}
    .dry{fill:#0d47a1;font-weight:700}
    .ghost{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:10.5px;fill:#3f5a3f}
  </style>

  <rect x="20" y="20" width="390" height="860" rx="46" fill="#1d1d1f"/>
  <rect x="30" y="30" width="370" height="840" rx="38" fill="#d9e4c8"/>
  <rect x="30" y="30" width="370" height="88" rx="38" fill="#ffffff"/>
  <rect x="30" y="80" width="370" height="38" fill="#ffffff"/>
  <text x="58" y="54" class="t b">18:12</text>
  <circle cx="86" cy="93" r="17" fill="#2f7fe0"/>
  <text x="86" y="98" class="btn" style="font-size:13px">ob</text>
  <text x="112" y="90" class="hdr">ossbot</text>
  <text x="112" y="107" class="s">✅ Reviews · bot</text>
  <line x1="30" y1="118" x2="400" y2="118" stroke="#d0d6cc"/>

  <rect x="40" y="128" width="300" height="236" rx="16" fill="#ffffff"/>
  <text class="t b" x="52" y="146">🧠 Skill ready for approval</text>
  <text class="t" x="52" y="162" style="font-size:11.5px"><tspan class="dry">🧪 DRY RUN</tspan> (n/a: local change)</text>
  <text class="t" x="52" y="180"><tspan class="b">nutrition-log v3</tspan> (update) · s_01JXYZ</text>
  <text class="t" x="52" y="197">Requested by Hermes (tier self_improve)</text>
  <text class="t claim" x="52" y="214">🤖 "log meals from photos and keep daily</text>
  <text class="t claim" x="52" y="231">totals without asking each time"</text>
  <text class="t" x="52" y="249">Tools: ossbot_feature_card, memory</text>
  <text class="t" x="52" y="266">✅ all within tier · ✅ size 4.1 KB ≤ 64 KB</text>
  <text class="t" x="52" y="283">Files: SKILL.md +54 −12 · examples.md +20</text>
  <text class="t warn" x="52" y="300">⚠️ 2 URLs <tspan style="fill:#111">· ✅ no hidden chars</tspan></text>
  <text class="t" x="52" y="317">sha256 <tspan class="m">9f2c…e1a0</tspan> · staged 3 min ago</text>
  <text class="t" x="52" y="336">⏳ Approval expires <tspan class="b">in 3 days</tspan></text>
  <text class="s" x="330" y="356" text-anchor="end">18:12</text>
  <rect x="40" y="370" width="148" height="32" rx="10" fill="#2e9d4f"/>
  <text class="btn" x="114" y="390">✅ Approve skill</text>
  <rect x="192" y="370" width="148" height="32" rx="10" fill="#5f7d64"/>
  <text class="btn" x="266" y="390">❌ Reject</text>
  <rect x="40" y="406" width="148" height="32" rx="10" fill="#5f7d64"/>
  <text class="btn" x="114" y="426">🧾 Full diff</text>
  <rect x="192" y="406" width="148" height="32" rx="10" fill="#5f7d64"/>
  <text class="btn" x="266" y="426">💬 Ask Hermes why</text>

  <rect x="40" y="450" width="300" height="190" rx="16" fill="#ffffff"/>
  <text class="t b" x="52" y="470">SKILL.md (1/1)</text>
  <rect x="50" y="478" width="280" height="148" rx="6" fill="#eef1ec"/>
  <text class="m" x="58" y="494">---</text>
  <text class="m" x="58" y="508">name: nutrition-log</text>
  <text class="m" x="58" y="522">tools: [ossbot_feature_card, memory]</text>
  <text class="m" x="58" y="536">---</text>
  <text class="m" x="58" y="550">When the user sends a food photo,</text>
  <text class="m" x="58" y="564">estimate items and grams, then call</text>
  <text class="m" x="58" y="578">ossbot_feature_card(feature=nutrition,</text>
  <text class="m" x="58" y="592">kind=meal, data=…). If the photo is</text>
  <text class="m" x="58" y="606">unclear, ask instead of guessing.</text>
  <text class="s" x="330" y="634" text-anchor="end">18:12</text>

  <text class="ghost" x="40" y="660">↓ after Approve — the card is edited into Confirm</text>
  <rect x="40" y="666" width="300" height="94" rx="16" fill="#ffffff" stroke="#9fb39a" stroke-dasharray="4 3"/>
  <text class="t b" x="52" y="682" style="font-size:11.5px">Confirm: activate skill nutrition-log v3</text>
  <text class="t b" x="52" y="697" style="font-size:11.5px">(sha256 9f2c…e1a0) for Hermes — local change,</text>
  <text class="t b" x="52" y="712" style="font-size:11.5px">dry-run does not apply. Tools stay within tier</text>
  <text class="t b" x="52" y="727" style="font-size:11.5px">self_improve. Expires in 5 min.</text>
  <text class="s" x="52" y="746">single-use · 5 min · bound to this message</text>
  <rect x="40" y="764" width="148" height="30" rx="10" fill="#d93025"/>
  <text class="btn" x="114" y="783">🧠 Activate skill</text>
  <rect x="192" y="764" width="148" height="30" rx="10" fill="#5f7d64"/>
  <text class="btn" x="266" y="783">↩️ Cancel</text>

  <rect x="30" y="800" width="370" height="70" fill="#ffffff"/>
  <rect x="42" y="814" width="70" height="30" rx="15" fill="#2f7fe0"/>
  <text class="btn" x="77" y="834">☰ Menu</text>
  <rect x="120" y="814" width="230" height="30" rx="15" fill="#f1f3f1"/>
  <text class="s" x="134" y="834" style="font-size:12px">Message</text>

  <!-- notes -->
  <text class="note nh" x="440" y="58">Skill approval (CR-002 self_improve)</text>
  <text class="note" x="440" y="80">Same machinery as a PR card: verbatim parts,</text>
  <text class="note" x="440" y="96">Approve minted after delivery, two taps (S1).</text>
  <text class="note b" x="440" y="126">Binding</text>
  <text class="note" x="440" y="144">{v:1, kind: skill_activate, skill, version,</text>
  <text class="note" x="440" y="160"> files_sha256 (sorted path → sha256),</text>
  <text class="note" x="440" y="176"> tools_requested, tier, policy_hash}</text>
  <text class="note" x="440" y="194">• A new staged version, a tier change or a reload</text>
  <text class="note" x="440" y="210">  invalidates it (S12 stale card).</text>
  <text class="note" x="440" y="228">• On Confirm, root copies exactly the bound files</text>
  <text class="note" x="440" y="244">  to the read-only active dir and hashes them;</text>
  <text class="note" x="440" y="260">  doctor detects drift. Card → "🧠 Active · v3"</text>
  <text class="note" x="440" y="276">  with [↩️ Deactivate…] (config confirm).</text>
  <text class="note b" x="440" y="306">Deterministic checks (gatekeeper)</text>
  <text class="note" x="440" y="324">• Requested tools ⊆ tier allowlist; tools named in</text>
  <text class="note" x="440" y="340">  the text vs the allowlist; size; URL count;</text>
  <text class="note" x="440" y="356">  hidden/bidi chars; mentions of approve, confirm,</text>
  <text class="note" x="440" y="372">  dry-run or token (⚠️ informational).</text>
  <text class="note" x="440" y="390">• Skills can never grant tools above the tier;</text>
  <text class="note" x="440" y="406">  terminal, code_execution, file, browser,</text>
  <text class="note" x="440" y="422">  delegation and cronjob stay off in every tier.</text>
  <text class="note b" x="440" y="452">Presentation</text>
  <text class="note" x="440" y="470">• The Hermes reason is a 🤖 claim (U6), ≤ 200 chars.</text>
  <text class="note" x="440" y="488">• Skill text is shown verbatim in &lt;pre&gt; (the bytes</text>
  <text class="note" x="440" y="504">  the agent will follow); updates also get a</text>
  <text class="note" x="440" y="520">  language-diff part against the active version.</text>
  <text class="note" x="440" y="538">• "Ask Hermes why" relays a question to the</text>
  <text class="note" x="440" y="554">  Assistant session; the answer never touches</text>
  <text class="note" x="440" y="570">  this card.</text>
  <text class="note" x="440" y="588">• Queue class 3 (same as open_pr); /skills lists</text>
  <text class="note" x="440" y="604">  staged and active skills.</text>
  <text class="note b" x="440" y="634">Limits</text>
  <text class="note" x="440" y="652">• Card ≤ 3,900 escaped chars; &lt;pre&gt; parts ≤ 3,500;</text>
  <text class="note" x="440" y="668">  2 rows × 2 buttons; labels ≤ 20; 24-byte data.</text>
  <text class="note" x="440" y="686">• Confirm uses danger (red): activation is not a</text>
  <text class="note" x="440" y="702">  public action, but it widens what Hermes does.</text>
  <text class="note b" x="440" y="730">Mode</text>
  <text class="note" x="440" y="748">• Local change: identical in DRY RUN and LIVE (dry-run</text>
  <text class="note" x="440" y="764">  governs public GitHub writes only). The badge is still</text>
  <text class="note" x="440" y="780">  shown, marked "n/a: local change" (S3).</text>
  <text class="note" x="440" y="798">• SkillApprovals has its own confirm_text; the PR</text>
  <text class="note" x="440" y="814">  kinds' Confirm sentences are untouched.</text>
  <text class="note" x="440" y="832">• Rows in skill_approvals (id s_ + 10); refused while</text>
  <text class="note" x="440" y="848">  paused or killed; tier switch → "tier_changed".</text>
  <text class="note" x="440" y="866">• A reply to this card or a part → Hermes in 💬</text>
  <text class="note" x="440" y="882">  Assistant ("Re: skill …"), never a review comment.</text>
</svg>

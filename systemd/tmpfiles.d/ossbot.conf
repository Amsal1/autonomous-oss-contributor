# ossbot runtime directories (DESIGN §7.3). /run/ossbot is root-owned; the two services that bind
# their own sockets there (gatekeeper, ossbox) get an ACL entry, and the sticky bit keeps every
# socket deletable only by its owner (or root).
# The explicit mask (m::rwx) is required: every later systemd-tmpfiles --create run (e.g. a systemd
# package upgrade) re-applies 1755 first, which narrows the ACL mask to r-x; without m::rwx the
# a+ line does not widen it again and the watchdog sees perm drift (stat 1755 instead of 1775).
d /run/ossbot 1755 root root -
a+ /run/ossbot - - - - u:gatekeeper:rwx,u:ossbox:rwx,m::rwx

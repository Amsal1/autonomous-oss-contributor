# Journal retention (DESIGN §18.10, plan D5): entries older than 30 days go; journald enforces it itself,
# also while ossbot is killed. Time only, no size cap (owner decision). Installed by provisioning as
# /etc/systemd/journald.conf.d/60-ossbot.conf, then systemd-journald is restarted.
[Journal]
MaxRetentionSec=30d
MaxFileSec=1week

[project]
name = "ossbot"
version = "0.1.0"
description = "Self-hosted autonomous open-source contributor with a deterministic human-approval gatekeeper"
readme = "docs/DESIGN.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.14"
# Pinned with == (PLAN Decision 4); latest stable on PyPI as of 2026-10-17.
dependencies = [
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "python-telegram-bot==22.8",
    "ruamel.yaml==0.19.1",
    "jinja2==3.1.6",
    "typer==0.27.3",
    "h11==0.16.0",
]

[project.scripts]
ossbot-gatekeeper = "ossbot.gatekeeper.main:main"
ossbot-dockerfilter = "ossbot.dockerfilter.main:main"
ossbot-sandboxd = "ossbot.sandboxd.main:main"
ossbot-runner = "ossbot.runner.main:main"
ossctl = "ossbot.ctl.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "respx==0.23.1",
    "hypothesis==6.170.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "import-linter==2.15",
]

[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.1"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra", "-p", "no:cacheprovider"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# a hanging test fails with a stack dump naming it (build-plan rule 8); slow suites override per test
timeout = 120
timeout_method = "thread"
# Starlette's TestClient (the e2e fakes) deprecates httpx (it wants the httpx2 fork) and the per-request
# timeout argument the shared sbx_client passes; both are test-harness noise, not product behaviour.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:You should not use the 'timeout' argument with the TestClient",
]
markers = [
    "unit: hermetic unit tests (default; no Docker, no network)",
    "telegram: Telegram rendering/handler tests with a mocked Bot API",
    "acp: fake V3 ACP server contract tests",
    "e2e: pipeline end to end against FakeRuntime and local fakes",
    "e2e_docker: pipeline end to end with real Docker (root)",
    "sandbox: sandbox isolation smoke tests (Docker + images, root)",
    "system: root-run probes on the provisioned distro",
    "isolation: WSL isolation checks run from Windows",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "vendor/hermes-kiro-provider", "scripts/dev/demo"]
cache-dir = "/tmp/ossbot-ruff-cache"
# the upstream V2 files of the vendored fork stay byte-identical (only kiro_acp/ is ours)
extend-exclude = ["vendor/hermes-kiro-provider/__init__.py", "vendor/hermes-kiro-provider/kiro_acp_*.py",
    "vendor/hermes-kiro-provider/tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PL", "PT", "TID", "BLE", "C4"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    "SIM108",
    "S101",   # assert is fine in tests and for type narrowing
    "S603",   # subprocess with argv lists is the project rule
    "RUF001", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108", "S608", "PLC0415", "PLR0904", "PT011", "PT018", "E741"]
# SQL built only from fixed fragments of the module itself; every value is a bound parameter.
"src/ossbot/gatekeeper/{approvals,state_machine,discovered_targets_writer}.py" = ["S608"]
# Enum values are signal names, not credentials.
"src/ossbot/gatekeeper/anomaly.py" = ["S105"]
# Hermes loads the plugin directory as a package under its own name, so the fork imports relatively.
"vendor/hermes-kiro-provider/kiro_acp/*.py" = ["TID252", "BLE001", "S110", "PLC0415", "S105"]
# loaded by Hermes as a plugin package under its own name
"hermes/plugins/**/*.py" = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src", "vendor/hermes-kiro-provider/kiro_acp"]
# the fork's root holds the plugin's own __init__.py, so module names come from these bases
mypy_path = "src:vendor/hermes-kiro-provider"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
cache_dir = "/tmp/ossbot-mypy-cache"
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

# strict for the safety-critical packages (DESIGN §18.1)
[[tool.mypy.overrides]]
module = ["ossbot.gatekeeper.*", "ossbot.dockerfilter.*", "ossbot.common.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["ruamel.*", "yaml", "agent"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["kiro_acp.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# ---------------------------------------------------------------- import-linter (§18.1, I1)
[tool.importlinter]
root_package = "ossbot"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Only ossbot.gatekeeper.submit imports ossbot.gatekeeper.github_writer"
type = "forbidden"
source_modules = ["ossbot.common", "ossbot.runner", "ossbot.sandboxd", "ossbot.sandbox_tools", "ossbot.dockerfilter",
    "ossbot.ctl", "ossbot.watchdog", "ossbot.gatekeeper.**"]
ignore_imports = ["ossbot.gatekeeper.submit -> ossbot.gatekeeper.github_writer"]
unmatched_ignore_imports_alerting = "error"
forbidden_modules = ["ossbot.gatekeeper.github_writer"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
# ADR-0019 C, U5 (FEAT-010 item 51): the review mirror's writer is reachable only through review_mirror.
name = "Only ossbot.gatekeeper.review_mirror imports ossbot.gatekeeper.review_mirror_writer"
type = "forbidden"
source_modules = ["ossbot.common", "ossbot.runner", "ossbot.sandboxd", "ossbot.sandbox_tools", "ossbot.dockerfilter",
    "ossbot.ctl", "ossbot.watchdog", "ossbot.gatekeeper.**"]
ignore_imports = ["ossbot.gatekeeper.review_mirror -> ossbot.gatekeeper.review_mirror_writer"]
unmatched_ignore_imports_alerting = "error"
forbidden_modules = ["ossbot.gatekeeper.review_mirror_writer"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
# DESIGN §14.12.8, U11 (FEAT-010 item 52): the Telegraph writer is reachable only through telegraph.
name = "Only ossbot.gatekeeper.telegraph imports ossbot.gatekeeper.telegraph_writer"
type = "forbidden"
source_modules = ["ossbot.common", "ossbot.runner", "ossbot.sandboxd", "ossbot.sandbox_tools", "ossbot.dockerfilter",
    "ossbot.ctl", "ossbot.watchdog", "ossbot.gatekeeper.**"]
ignore_imports = ["ossbot.gatekeeper.telegraph -> ossbot.gatekeeper.telegraph_writer"]
unmatched_ignore_imports_alerting = "error"
forbidden_modules = ["ossbot.gatekeeper.telegraph_writer"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
# post-v1 open discovery: discovered_targets rows are written only through the service's rules.
name = "Only ossbot.gatekeeper.discovered_targets imports ossbot.gatekeeper.discovered_targets_writer"
type = "forbidden"
source_modules = ["ossbot.common", "ossbot.runner", "ossbot.sandboxd", "ossbot.sandbox_tools", "ossbot.dockerfilter",
    "ossbot.ctl", "ossbot.watchdog", "ossbot.gatekeeper.**"]
ignore_imports = ["ossbot.gatekeeper.discovered_targets -> ossbot.gatekeeper.discovered_targets_writer"]
unmatched_ignore_imports_alerting = "error"
forbidden_modules = ["ossbot.gatekeeper.discovered_targets_writer"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
# owner decision sandbox_open (ADR-0023, open-discovery design §13.3): only these modules reach the hold
# service. ignore_imports lists exactly the real edges (L4; stage_runs, packaging, submit and
# contributions use ctx.holds or an injected check, not an import); the AST test pins the same set.
name = "Only the hold API, hold cards and the hold call sites import ossbot.gatekeeper.holds"
type = "forbidden"
source_modules = ["ossbot.common", "ossbot.runner", "ossbot.sandboxd", "ossbot.sandbox_tools", "ossbot.dockerfilter",
    "ossbot.ctl", "ossbot.watchdog", "ossbot.gatekeeper.**"]
ignore_imports = ["ossbot.gatekeeper.app -> ossbot.gatekeeper.holds",
    "ossbot.gatekeeper.context -> ossbot.gatekeeper.holds",
    "ossbot.gatekeeper.telegram.hold_cards -> ossbot.gatekeeper.holds"]
unmatched_ignore_imports_alerting = "error"
forbidden_modules = ["ossbot.gatekeeper.holds"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
# ADR-0003 addendum (post-v1 owner fix rounds, 2026-10-23): the human WATCHING->IMPLEMENTING edge is
# reachable only from an owner tap. No API route, chat relay (Hermes) or feature reaches owner_fix,
# directly or indirectly (I9, I13); the Telegram action modules are its only importers.
name = "Only Telegram handlers reach ossbot.gatekeeper.owner_fix"
type = "forbidden"
source_modules = ["ossbot.common", "ossbot.runner", "ossbot.sandboxd", "ossbot.sandbox_tools", "ossbot.dockerfilter",
    "ossbot.ctl", "ossbot.watchdog", "ossbot.gatekeeper.api", "ossbot.gatekeeper.chat", "ossbot.gatekeeper.features"]
forbidden_modules = ["ossbot.gatekeeper.owner_fix"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
# DESIGN §18.10, plan D8: the gatekeeper's retention deleter runs only through the operator API.
name = "Only ossbot.gatekeeper.api.retention imports ossbot.gatekeeper.retention"
type = "forbidden"
source_modules = ["ossbot.common", "ossbot.runner", "ossbot.sandboxd", "ossbot.sandbox_tools", "ossbot.dockerfilter",
    "ossbot.ctl", "ossbot.watchdog", "ossbot.gatekeeper.**"]
ignore_imports = ["ossbot.gatekeeper.api.retention -> ossbot.gatekeeper.retention"]
unmatched_ignore_imports_alerting = "error"
forbidden_modules = ["ossbot.gatekeeper.retention"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
# DESIGN §18.10, plan D8: the root-side deleter (ossctl gc) runs only through its CLI command.
name = "Only ossbot.ctl.cli imports ossbot.ctl.gc"
type = "forbidden"
source_modules = ["ossbot.common", "ossbot.runner", "ossbot.sandboxd", "ossbot.sandbox_tools", "ossbot.dockerfilter",
    "ossbot.ctl.**", "ossbot.watchdog", "ossbot.gatekeeper"]
ignore_imports = ["ossbot.ctl.cli -> ossbot.ctl.gc"]
unmatched_ignore_imports_alerting = "error"
forbidden_modules = ["ossbot.ctl.gc"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Untrusted-side components never import the gatekeeper"
type = "forbidden"
source_modules = ["ossbot.runner", "ossbot.sandboxd", "ossbot.sandbox_tools"]
forbidden_modules = ["ossbot.gatekeeper"]

[[tool.importlinter.contracts]]
# ADR-0022: a pipeline model backend runs inside the sandbox/probe boundary through the sandboxd client;
# it never reaches the gatekeeper (its write paths included), sandboxd internals or the Docker filter.
name = "Model backends never import the gatekeeper, sandboxd or the Docker filter"
type = "forbidden"
source_modules = ["ossbot.runner.backends"]
forbidden_modules = ["ossbot.gatekeeper", "ossbot.sandboxd", "ossbot.dockerfilter", "ossbot.ctl"]

[[tool.importlinter.contracts]]
name = "Sandbox tools are stdlib-only (copied into the images as single files)"
type = "forbidden"
source_modules = ["ossbot.sandbox_tools"]
forbidden_modules = [
    "ossbot.common", "ossbot.gatekeeper", "ossbot.runner", "ossbot.sandboxd", "ossbot.dockerfilter",
    "ossbot.ctl", "ossbot.watchdog",
]

[[tool.importlinter.contracts]]
name = "ossbot.common depends on no component"
type = "forbidden"
source_modules = ["ossbot.common"]
forbidden_modules = [
    "ossbot.gatekeeper", "ossbot.runner", "ossbot.sandboxd", "ossbot.sandbox_tools",
    "ossbot.dockerfilter", "ossbot.ctl", "ossbot.watchdog",
]

[[tool.importlinter.contracts]]
# PLAN item 23a / DESIGN §15: the chat relay and the Hermes surface never reach a GitHub write path.
name = "The chat relay never imports the submit path"
type = "forbidden"
source_modules = ["ossbot.gatekeeper.chat"]
forbidden_modules = ["ossbot.gatekeeper.submit", "ossbot.gatekeeper.github_writer"]

[[tool.importlinter.contracts]]
# DESIGN §14.20.1 (PLAN item 44): the chat relay can't reach a decision, a state change or the control
# plane, and writes Telegram rows only through telegram.ui (never the outbox directly). The features
# package, review_mirror_writer and telegraph_writer have their own contracts (FEAT-010).
name = "The chat relay never imports the approval, state, control or outbox modules"
type = "forbidden"
source_modules = ["ossbot.gatekeeper.chat"]
forbidden_modules = ["ossbot.gatekeeper.approvals", "ossbot.gatekeeper.decisions",
    "ossbot.gatekeeper.proposal_approvals", "ossbot.gatekeeper.skill_approvals", "ossbot.gatekeeper.state_machine",
    "ossbot.gatekeeper.control", "ossbot.gatekeeper.outbox"]

[[tool.importlinter.contracts]]
# DESIGN §14.18.3 step 5 (FEAT-010 item 49): features have read/personal actions only.
name = "Features never import the approval, submit, writer, state or control modules"
type = "forbidden"
source_modules = ["ossbot.gatekeeper.features"]
forbidden_modules = ["ossbot.gatekeeper.approvals", "ossbot.gatekeeper.decisions", "ossbot.gatekeeper.submit",
    "ossbot.gatekeeper.github_writer", "ossbot.gatekeeper.state_machine", "ossbot.gatekeeper.control",
    "ossbot.gatekeeper.review_mirror_writer", "ossbot.gatekeeper.telegraph_writer"]

[[tool.importlinter.contracts]]
# DESIGN §14.20.1, U1: the kit renders and queues; it never decides. Only the decision services mint
# approval tokens with an approval id (U3).
name = "The UI kit never imports the decision or submit paths"
type = "forbidden"
source_modules = ["ossbot.gatekeeper.telegram.ui"]
# typing only (under TYPE_CHECKING): send.py annotates its AppContext parameter
ignore_imports = ["ossbot.gatekeeper.telegram.ui.send -> ossbot.gatekeeper.context"]
unmatched_ignore_imports_alerting = "error"
forbidden_modules = ["ossbot.gatekeeper.approvals", "ossbot.gatekeeper.decisions", "ossbot.gatekeeper.submit",
    "ossbot.gatekeeper.github_writer", "ossbot.gatekeeper.state_machine", "ossbot.gatekeeper.control"]

[[tool.importlinter.contracts]]
# review FEAT-007 round 2 (F007-R2-4): the root ACP probe client and the other root/operator tools stay
# out of the gatekeeper; it reads the probe file through ossbot.common.probe_result.
name = "The gatekeeper never imports ossctl or the root probe"
type = "forbidden"
source_modules = ["ossbot.gatekeeper"]
forbidden_modules = ["ossbot.ctl"]

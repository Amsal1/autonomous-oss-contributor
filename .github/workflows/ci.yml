# ossbot CI (DESIGN §5 AC 24, §18.5; ADR-0015). Hermetic only: no secrets, no network writes, read-only
# token. Every action is pinned by full commit SHA (config/versions.lock.yaml github_actions); the
# gitleaks and PSScriptAnalyzer binaries are fetched from their pinned releases and sha256-verified.
name: ci

# Manual only (owner decision 2026-10-20): Actions -> ci -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.1"
  # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz 0.13.1 (versions.lock.yaml uv.sha256)
  UV_CHECKSUM: "eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220"
  GITLEAKS_URL: "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --frozen
      - name: ruff
        run: |
          uv run --frozen ruff check src tests
          uv run --frozen ruff format --check src tests
      - name: mypy
        run: uv run --frozen mypy
      - name: import-linter
        run: uv run --frozen lint-imports
      - name: shellcheck
        run: git ls-files -z '*.sh' .githooks/pre-commit | xargs -0 shellcheck -S warning
      - name: docs check (README command table)
        run: uv run --frozen ossctl docs commands --check
      - name: profile example check
        run: uv run --frozen pytest -q tests/unit/common/test_profile_example.py
      - name: personal values (no profile in CI; the example check above covers it)
        run: uv run --frozen ossctl lint personal

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --frozen
      - name: hermetic pytest
        run: uv run --frozen pytest -m "unit or telegram or acp or e2e" -n auto -q

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (pinned binary, sha256-verified)
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz "$GITLEAKS_URL"
          echo "$GITLEAKS_SHA256  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --config .gitleaks.toml .

  psscriptanalyzer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PSScriptAnalyzer (pinned release, sha256-verified)
        shell: pwsh
        run: ./scripts/dev/psscriptanalyzer.ps1 -CacheDir "$env:RUNNER_TEMP/psmodules"
